# Drawbore npm staged publish — canonical template for the abmach portfolio.
# One-time setup on npmjs.com -> package settings -> Trusted publishing:
#   Provider:     GitLab CI/CD
#   Namespace:    abmach
#   Project:      drawbore
#   CI file path: .gitlab-ci.yml
#   Environment:  leave empty
#   Allowed actions: stage publish only
#
# After a maintainer approves a stage:
#   npm stage list
#   npm stage approve <stage-id>
#
# Staged publishing requires npm CLI >= 11.15 / Node >= 22.14.
# node:24 bundles an older npm, so upgrade explicitly.

# The suite must run before a tag reaches the publish job, and on every branch
# and merge request — otherwise the first execution of `npm test` happens
# inside the release job, after the version bump. Both test jobs also run the
# strict notebook check. The second job tests the declared `engines` floor;
# the publish job runs the newest LTS.
test:
  stage: test
  image: node:24
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm ci
    - npm test
    - npm run check

# The floor moved with `@inquirer/prompts` 8.8.0, which requires
# `^22.22.2 || ^24.15.0 || >=26.0.0`: a Node 20 job installs it with 85
# `EBADENGINE` warnings and then tests a runtime `engines` forbids. Keep this
# job on the oldest line the manifest allows, not on a line it does not.
test-node22:
  stage: test
  image: node:22.22.2
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - npm ci
    - npm test
    - npm run check

stage-npm:
  stage: deploy
  image: node:24
  needs:
    - test
    - test-node22
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  id_tokens:
    # npm reads NPM_ID_TOKEN for the OIDC token exchange; the audience must be
    # npm:<registry host>. SIGSTORE_ID_TOKEN is separate — it signs provenance
    # and uses the sigstore audience.
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    # Staged publishing needs npm >= 11.15; pin the reviewed version so the
    # release tooling is reproducible instead of drifting with the npm@11 tag.
    - npm install -g npm@11.21.3
    - npm ci
    - npm test
    - PKG_NAME=$(node -p "require('./package.json').name")
    - PKG_VERSION=$(node -p "require('./package.json').version")
    - TAG_VERSION="${CI_COMMIT_TAG#v}"
    - if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then echo "Tag/package version mismatch"; exit 1; fi
    - |
      if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
        echo "Version already published — refusing to stage."
        exit 1
      fi
      npm publish --dry-run
      npm stage publish --provenance --access public
      echo "Staged $CI_COMMIT_TAG — a maintainer must now approve it: npm stage list && npm stage approve <stage-id> (2FA)."